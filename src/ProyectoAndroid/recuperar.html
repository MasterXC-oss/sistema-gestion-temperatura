<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #e9faff, #f7ffff);
        }

        .container {
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            padding: 40px 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Decoración */

        .circle {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
        }

        .circle-one {
            width: 180px;
            height: 180px;
            background: #b8f0ff;
            top: -70px;
            right: -70px;
            opacity: 0.7;
        }

        .circle-two {
            width: 140px;
            height: 140px;
            background: #b9f4e9;
            bottom: -50px;
            left: -50px;
            opacity: 0.6;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        /* Botón volver */

        .back {
            position: absolute;
            top: 25px;
            left: 0;
            text-decoration: none;
            color: #164e63;
            font-size: 15px;
            font-weight: bold;
        }

        /* Icono */

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;

            border-radius: 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 32px;

            background: linear-gradient(
                135deg,
                #38bdf8,
                #2dd4bf
            );

            box-shadow:
                0 12px 30px rgba(45, 212, 191, 0.25);
        }

        h1 {
            text-align: center;
            color: #164e63;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        /* Input */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #164e63;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-box {
            height: 54px;
            background: white;
            border: 1px solid #d8edf3;
            border-radius: 16px;

            display: flex;
            align-items: center;

            padding: 0 16px;

            box-shadow:
                0 5px 15px rgba(22, 78, 99, 0.04);

            transition: 0.2s;
        }

        .input-box:focus-within {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        .icon {
            font-size: 19px;
            margin-right: 12px;
        }

        input {
            width: 100%;
            border: none;
            outline: none;

            background: transparent;

            font-size: 15px;
            color: #164e63;
        }

        input::placeholder {
            color: #a0b6bf;
        }

        /* Botón */

        .recover-button {
            width: 100%;
            height: 56px;

            border: none;
            border-radius: 17px;

            background: linear-gradient(
                135deg,
                #38bdf8,
                #2dd4bf
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(45, 212, 191, 0.25);

            transition: 0.2s;
        }

        .recover-button:active {
            transform: scale(0.98);
        }

        /* Volver al login */

        .login-link {
            text-align: center;
            margin-top: 25px;
        }

        .login-link a {
            color: #0891b2;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: #94a3b8;
            font-size: 13px;
        }

        /* Escritorio */

        @media (min-width: 500px) {

            .container {
                min-height: auto;
                padding: 45px 35px;

                background: rgba(255, 255, 255, 0.65);

                border-radius: 30px;

                box-shadow:
                    0 20px 60px rgba(22, 78, 99, 0.1);
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>

        <div class="content">

            <a href="joan://back" class="back">
                ← Volver
            </a>

            <div class="logo">
                🔐
            </div>

            <h1>
                Recuperar contraseña
            </h1>

            <p class="description">
                No te preocupes. Ingresa tu correo electrónico
                y te enviaremos un código para recuperar
                el acceso a tu cuenta.
            </p>

            <form id="recover-form">

                <div class="input-group">

                    <label>
                        Correo electrónico
                    </label>

                    <div class="input-box">

                        <span class="icon">
                          
                        </span>

                        <input
                            type="email"
                            id="correo"
                            placeholder="Ingresa tu correo"
                            autocomplete="email"
                        >

                    </div>

                </div>

                <button
                    type="submit"
                    class="recover-button"
                >
                    ENVIAR CÓDIGO
                </button>

            </form>

            <form id="reset-form">
                <div class="input-group">
                    <label>Código de recuperación</label>
                    <div class="input-box">
                        <input id="codigo" type="text" inputmode="numeric"
                               placeholder="Código de 6 dígitos" autocomplete="one-time-code">
                    </div>
                </div>

                <div class="input-group">
                    <label>Nueva contraseña</label>
                    <div class="input-box">
                        <input id="password" type="password"
                               placeholder="Nueva contraseña segura" autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="recover-button">
                    GUARDAR CONTRASEÑA
                </button>
            </form>

            <div class="login-link">
                <a href="joan://back">
                    ← Volver al inicio de sesión
                </a>
            </div>

            <div class="footer">
                Tu cuenta estará segura
            </div>

        </div>

    </main>

    <script>
        const recoverForm = document.getElementById("recover-form");
        const resetForm = document.getElementById("reset-form");
        const correo = document.getElementById("correo");

        recoverForm.addEventListener("submit", function (event) {
            event.preventDefault();
            window.location.href = "joan://send-code?correo=" +
                encodeURIComponent(correo.value);
        });

        resetForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const codigo = encodeURIComponent(document.getElementById("codigo").value);
            const password = encodeURIComponent(document.getElementById("password").value);
            window.location.href = "joan://reset-password?correo=" +
                encodeURIComponent(correo.value) + "&codigo=" + codigo +
                "&password=" + password;
        });
    </script>

</body>
</html>
