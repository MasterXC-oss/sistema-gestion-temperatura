<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #e9faff, #f7ffff);
        }

        .login-container {
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            padding: 45px 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Círculos decorativos */

        .circle {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
        }

        .circle-one {
            width: 180px;
            height: 180px;
            background: #b8f0ff;
            top: -70px;
            right: -70px;
            opacity: 0.7;
        }

        .circle-two {
            width: 140px;
            height: 140px;
            background: #b9f4e9;
            bottom: -50px;
            left: -50px;
            opacity: 0.6;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            background: linear-gradient(135deg, #38bdf8, #2dd4bf);
            box-shadow: 0 12px 30px rgba(45, 212, 191, 0.25);
        }

        h1 {
            text-align: center;
            color: #164e63;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #164e63;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-box {
            height: 54px;
            background: white;
            border: 1px solid #d8edf3;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(22, 78, 99, 0.04);
        }

        .input-box:focus-within {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        .icon {
            font-size: 19px;
            margin-right: 12px;
        }

        input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 15px;
            color: #164e63;
            background: transparent;
        }

        input::placeholder {
            color: #a0b6bf;
        }

        .forgot {
            text-align: right;
            margin: 5px 2px 25px;
        }

        .forgot a {
            color: #0891b2;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 17px;
            background: linear-gradient(135deg, #38bdf8, #2dd4bf);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(45, 212, 191, 0.25);
            transition: 0.2s;
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: #94a3b8;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }

        @media (min-width: 500px) {
            .login-container {
                min-height: auto;
                padding: 45px 35px;
                background: rgba(255, 255, 255, 0.65);
                border-radius: 30px;
                box-shadow: 0 20px 60px rgba(22, 78, 99, 0.1);
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>

        <div class="content" id="login-view">

            <div class="logo">
                🌡
            </div>

            <h1>Bienvenido</h1>

            <p class="subtitle">
                Ingresa para continuar
            </p>

            <form id="login-form">

                <div class="input-group">
                    <label>Usuario</label>

                    <div class="input-box">

                        <input
                            type="text"
                            id="usuario"
                            placeholder="Ingresa tu usuario"
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label>Contraseña</label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <div class="forgot">
                    <a href="#" id="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="login-button">
                    INGRESAR
                </button>

            </form>

            <div class="footer">
                Una experiencia fresca y sencilla
            </div>

        </div>

        <div class="content hidden" id="recovery-view">
            <a href="#" class="back" id="back-link">← Volver</a>

            <div class="logo">🔐</div>

            <h1>Recuperar contraseña</h1>

            <p class="subtitle">
                Ingresa tu correo y te enviaremos un código para recuperar el acceso.
            </p>

            <form id="recover-form">
                <div class="input-group">
                    <label for="recovery-email">Correo electrónico</label>
                    <div class="input-box">
                        <input id="recovery-email" type="email"
                               placeholder="Ingresa tu correo" autocomplete="email">
                    </div>
                </div>

                <button type="submit" class="login-button">ENVIAR CÓDIGO</button>
            </form>

            <div class="footer">Tu cuenta estará segura</div>
        </div>

    </main>

    <script>
        const loginView = document.getElementById("login-view");
        const recoveryView = document.getElementById("recovery-view");

        document.getElementById("forgot-link").addEventListener("click", function (event) {
            event.preventDefault();
            loginView.classList.add("hidden");
            recoveryView.classList.remove("hidden");
        });

        document.getElementById("back-link").addEventListener("click", function (event) {
            event.preventDefault();
            recoveryView.classList.add("hidden");
            loginView.classList.remove("hidden");
        });

        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();
            const usuario = encodeURIComponent(document.getElementById("usuario").value);
            const password = encodeURIComponent(document.getElementById("password").value);
            window.location.href = "joan://login?usuario=" + usuario + "&password=" + password;
        });

        document.getElementById("recover-form").addEventListener("submit", function (event) {
            event.preventDefault();
            window.location.href = "joan://send-code?correo=" +
                encodeURIComponent(document.getElementById("recovery-email").value);
        });
    </script>

</body>
</html>
